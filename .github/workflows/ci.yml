name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: CUDA on a simulated T4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GitHub's hosted runners have no GPU.  PantheonSim provides simulated
      # ones, so the tests can run on every push; it checks behaviour, not
      # performance.
      - name: Set up the simulated GPU
        uses: pantheongpu/pantheonsim@main
        with:
          gpu: nvidia/t4
          cuda-toolkit: '12.6'

      # Build for the simulated card instead of CMake's "native" default, which
      # would query a device at configure time.  The Fortran reference is
      # benchmark-only, so skip it here.
      - name: Configure (Release)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DGSPIKE_BUILD_REF=OFF

      - name: Build (Release)
        run: cmake --build build -j "$(nproc)"

      - name: Test (Release)
        run: ctest --test-dir build --output-on-failure

      - name: Configure (Debug, AddressSanitizer)
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DGSPIKE_BUILD_REF=OFF

      - name: Build (Debug, AddressSanitizer)
        run: cmake --build build-asan -j "$(nproc)"

      # ctest sets ASAN_OPTIONS for the test; repeat it for the outer process.
      - name: Test (Debug, AddressSanitizer)
        run: ASAN_OPTIONS=protect_shadow_gap=0 ctest --test-dir build-asan --output-on-failure
