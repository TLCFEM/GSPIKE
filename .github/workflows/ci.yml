name: CI
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cuda:
    name: CUDA on a simulated T4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up the simulated GPU
        # v0.2.1; pinned to a commit so the simulator cannot change under us.
        uses: pantheongpu/pantheonsim@d91a876715890676e77a723797bf97b2426c80ad # v0.2.1
        with:
          gpu: nvidia/t4
          cuda-toolkit: '12.6'
      - name: Configure (Release)
        # Pascal (sm_75) has native fp16 arithmetic; C++23 exposes the
        # std::float16_t feature macros used by the public concept.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DCMAKE_CXX_STANDARD=23
          -DGSPIKE_BENCH=ON
      - name: Build (Release)
        run: cmake --build build -j "$(nproc)"
      - name: Test (Release)
        run: ctest --test-dir build --output-on-failure
      - name: Float16 smoke test (Release)
        # Exercises the CUDA __half factorization and the three-step
        # double-residual refinement path in the mixed half solver.
        run: |
          ./build/spike_bench --type float16 10000 100 1
          ./build/spike_bench --type mixed16 10000 100 1
      - name: Configure (Debug)
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DCMAKE_CXX_STANDARD=23
          -DGSPIKE_BENCH=OFF
      - name: Build (Debug)
        run: cmake --build build-asan -j "$(nproc)"
      - name: Test (Debug)
        run: ctest --test-dir build-asan --output-on-failure
